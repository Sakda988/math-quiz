<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>แบบทดสอบคณิตศาสตร์รวม ม.3 + ม.5</title>
<style>
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f3f4f6;margin:0;color:#111827}
.container{max-width:820px;margin:auto;padding:20px}
.header,.card{background:white;border-radius:16px;padding:22px;margin-bottom:16px;box-shadow:0 3px 12px #0001}
h1{margin-top:0;font-size:25px}.sub{color:#6b7280}
.q{border-top:1px solid #e5e7eb;padding:20px 0}.q:first-child{border-top:0}
.badge{display:inline-block;background:#e5e7eb;border-radius:999px;padding:5px 10px;font-size:13px;margin-bottom:9px}
label{display:block;border:1px solid #d1d5db;border-radius:10px;padding:12px;margin:9px 0;cursor:pointer}
label:hover{background:#f9fafb}
button{width:100%;border:0;border-radius:12px;padding:14px;background:#111827;color:white;font-size:17px;cursor:pointer}
button:hover{opacity:.9}
#result{display:none}.score{font-size:30px;font-weight:800}
.correct{background:#dcfce7!important;border-color:#16a34a!important}.wrong{background:#fee2e2!important;border-color:#dc2626!important}
.small{font-size:14px;color:#6b7280}.answer{font-weight:700}
@media(max-width:600px){.container{padding:10px}.header,.card{padding:16px}}
</style>
</head>
<body>
<div class="container">
<div class="header">
<h1>แบบทดสอบคณิตศาสตร์รวม ม.3 + ม.5</h1>
<p class="sub">20 ข้อ • ข้อละ 4 ตัวเลือก • 20 คะแนน • เลือกคำตอบที่ถูกที่สุดเพียงข้อเดียว</p>
<p class="sub">รูปแบบ: ทำข้อสอบให้ครบก่อน แล้วกด “ส่งคำตอบและดูคะแนน” เพื่อดูคะแนนและเฉลย</p>
</div>

<form id="quiz" class="card"></form>
<button onclick="submitQuiz();return false;">ส่งคำตอบและดูคะแนน</button>

<div id="result" class="card">
<h2>ผลการทดสอบ</h2>
<div class="score" id="score"></div>
<p id="percent"></p>
<p id="summary"></p>
<h3>เฉลยและผลรายข้อ</h3>
<div id="review"></div>
</div>
</div>

<script>
const questions=[
["ม.3","สมการเชิงเส้นตัวแปรเดียว","ถ้า 2x − 7 = 15 แล้ว x มีค่าเท่าใด",["8","9","11","12"],2],
["ม.3","รากที่สอง","ค่าของ √144 + √25 เท่ากับเท่าใด",["13","15","17","19"],2],
["ม.5","ฟังก์ชัน","ถ้า f(x) = 2x + 3 แล้ว f(4) มีค่าเท่าใด",["8","10","11","12"],2],
["ม.3","การแยกตัวประกอบพหุนาม","ผลลัพธ์ของ (x + 3)(x − 2) คือข้อใด",["x² + x − 6","x² − x − 6","x² + 5x − 6","x² + x + 6"],0],
["ม.3","เลขยกกำลัง","ถ้า 3² × 3⁴ มีค่าเท่าใด",["3⁶","3⁸","6³","9⁴"],0],
["ม.3","สมการกำลังสอง","สมการ x² − 5x + 6 = 0 มีคำตอบใด",["x = 1 และ 6","x = 2 และ 3","x = −2 และ −3","x = −2 และ 3"],1],
["ม.3","สถิติ: ค่าเฉลี่ย","ค่าเฉลี่ยของ 6, 8, 10, 12 และ 14 เท่ากับเท่าใด",["9","10","11","12"],1],
["ม.3","ความน่าจะเป็น","โยนเหรียญ 1 เหรียญ 1 ครั้ง ความน่าจะเป็นที่จะออกหัวเท่ากับเท่าใด",["0","1/4","1/2","1"],2],
["ม.3","กราฟเส้นตรง","เส้นตรง y = 3x − 4 มีความชันเท่าใด",["−4","−3","3","4"],2],
["ม.3","สมการเชิงเส้นสองข้าง","ถ้า 5x + 2 = 3x + 14 แล้ว x มีค่าเท่าใด",["4","5","6","7"],2],
["ม.5","ลำดับเลขคณิต","ลำดับเลขคณิต 5, 8, 11, 14, ... พจน์ที่ 10 มีค่าเท่าใด",["29","32","35","38"],1],
["ม.5","ลอการิทึม","ถ้า log₁₀ 1000 มีค่าเท่าใด",["1","2","3","4"],2],
["ม.3","ระบบสมการเชิงเส้น","ถ้า x + y = 10 และ x − y = 4 แล้ว x มีค่าเท่าใด",["3","5","7","9"],2],
["ม.5","ตรีโกณมิติ","ถ้า sin θ = 3/5 และ θ เป็นมุมแหลม แล้ว cos θ มีค่าเท่าใด",["3/5","4/5","5/4","1/5"],1],
["ม.5","เวกเตอร์","ถ้าเวกเตอร์ u = (3, 4) แล้วขนาดของเวกเตอร์ u เท่ากับเท่าใด",["4","5","6","7"],1],
["ม.3","ค่าสัมบูรณ์","ถ้า |x − 3| = 5 แล้วค่าของ x ที่เป็นไปได้คือข้อใด",["x = 8 เท่านั้น","x = −2 เท่านั้น","x = 8 หรือ −2","x = 2 หรือ 8"],2],
["ม.5","ฟังก์ชันกำลังสอง","กราฟของ y = x² เป็นกราฟชนิดใด",["เส้นตรง","พาราโบลา","วงกลม","ไฮเพอร์โบลา"],1],
["ม.3","ความน่าจะเป็น","ถ้าสุ่มเลือกจำนวนเต็มหนึ่งจำนวนจาก 1 ถึง 10 ความน่าจะเป็นที่จะได้จำนวนคู่เท่ากับเท่าใด",["1/5","1/3","1/2","2/3"],2],
["ม.3","สมการกำลังสอง","ถ้า x² = 49 แล้วเซตคำตอบของ x คือข้อใด",["{7}","{−7}","{−7, 7}","{0, 7}"],2],
["ม.3","วงกลมและพื้นที่","ถ้ารัศมีวงกลมเท่ากับ 7 หน่วย และใช้ π = 22/7 พื้นที่วงกลมเท่ากับเท่าใด",["44 ตารางหน่วย","154 ตารางหน่วย","308 ตารางหน่วย","49 ตารางหน่วย"],1]
];

const form=document.getElementById("quiz");
questions.forEach((q,i)=>{
 let div=document.createElement("div");div.className="q";
 div.innerHTML=`<span class="badge">ข้อ ${i+1} • เนื้อหา ${q[0]} • ${q[1]}</span><h3>${q[2]}</h3>`+
 q[3].map((o,j)=>`<label><input type="radio" name="q${i}" value="${j}"> ${String.fromCharCode(65+j)}. ${o}</label>`).join("");
 form.appendChild(div);
});

function submitQuiz(){
 let score=0,answered=0,review="";
 questions.forEach((q,i)=>{
   const selected=document.querySelector(`input[name=q${i}]:checked`);
   if(selected) answered++;
   const val=selected?Number(selected.value):-1;
   if(val===q[4]) score++;
   review+=`<div class="q"><span class="badge">ข้อ ${i+1} • ${q[0]} • ${q[1]}</span><p><b>${q[2]}</b></p>`;
   q[3].forEach((o,j)=>{
     const cls=j===q[4]?"correct":(j===val?"wrong":"");
     review+=`<div class="${cls}" style="padding:9px;border-radius:8px;margin:5px 0">${String.fromCharCode(65+j)}. ${o}${j===q[4]?' ← เฉลย':''}</div>`;
   });
   review+=`<p class="small">${val<0?"ยังไม่ได้ตอบข้อนี้":val===q[4]?"ตอบถูก":"ตอบผิด"}</p></div>`;
 });
 document.getElementById("score").textContent=`${score} / 20 คะแนน`;
 document.getElementById("percent").textContent=`คิดเป็น ${score*5}%`;
 document.getElementById("summary").textContent=`ตอบแล้ว ${answered} จาก 20 ข้อ`;
 document.getElementById("review").innerHTML=review;
 document.getElementById("result").style.display="block";
 window.scrollTo({top:document.getElementById("result").offsetTop-10,behavior:"smooth"});
}
</script>
</body>
</html>
